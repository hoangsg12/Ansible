---
- name: Tao VLAN va kiem tra tren Cisco Router/Switch
  hosts: all
  gather_facts: no

  tasks:
    - name: Create vlan
      cisco.ios.ios_vlan:
        vlan_id: "{{ item.number }}"
        name: "{{ item.name }}"
        state: present
      loop:
        - { number: 10, name: "IT" }
        - { number: 20, name: "HR" }
        - { number: 30, name: "Kythuat" }

    - name: Show vlan
      cisco.ios.ios_command:
        commands:
          - show vlan brief
      register: show_vlan

    - name: Hien thi danh sach VLAN
      ansible.builtin.debug:
        msg: "{{ show_vlan.stdout[0].split('\n') }}"
